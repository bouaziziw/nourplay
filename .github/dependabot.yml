version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      dev-tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "@types/*"
          - "vitest*"
          - "turbo"
      next:
        patterns:
          - "next"
          - "next-intl"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
    ignore:
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
