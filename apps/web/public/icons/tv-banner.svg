<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c90d8"/>
      <stop offset="100%" stop-color="#0f6fa8"/>
    </linearGradient>
  </defs>
  <!-- Background 320x180 (16:9) Android TV Banner -->
  <rect width="320" height="180" fill="url(#bg)"/>
  
  <!-- Logo Icon Container -->
  <g transform="translate(30, 42)">
    <!-- Play button shape -->
    <rect width="96" height="96" rx="22" fill="#ffffff" fill-opacity="0.15"/>
    <polygon points="36,28 36,68 70,48" fill="#ffffff"/>
    <circle cx="70" cy="26" r="8" fill="#fbbf24"/>
  </g>

  <!-- Typography: NourPlay -->
  <text x="142" y="94" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Nour<tspan fill="#fbbf24">Play</tspan></text>
  <text x="144" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#bae6fd" letter-spacing="1.5">STREAMING &amp; FAMILLE</text>
</svg>